name: solid_lints
description:
  Lints for Dart and Flutter based on software industry standards and best
  practices.
version: 1.0.0-dev.2
homepage: https://github.com/solid-software/solid_lints/
documentation: https://solid-software.github.io/solid_lints/docs/intro
topics: [lints, linter, lint, analysis, analyzer]
platforms:
  android:
  ios:
  linux:
  macos:
  web:
  windows:

environment:
  sdk: ">=3.12.0 <4.0.0"

dependencies:
  # Needed until required types for fixes are exported by analyzer_server_plugin
  # More details: https://github.com/dart-lang/sdk/issues/61821
  analyzer_plugin: ^0.14.14
  analyzer: ^14.1.0
  collection: ^1.19.1
  analysis_server_plugin: ^0.3.20
  equatable: ^2.1.0
  glob: ^2.1.3
  path: ^1.9.1
  yaml: ^3.1.3

dev_dependencies:
  args: ^2.7.0
  analyzer_testing: ^0.3.4
  test: ^1.31.2
  test_reflective_loader: ^0.4.0

plugin:
  platforms:
    dart:
      pluginClass: SolidLintsPlugin
